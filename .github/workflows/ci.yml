name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Validate JSON manifests
        run: node -e "for (const file of ['package.json', 'plugin.json', 'hooks.json', 'benchmark/cases.json']) JSON.parse(require('node:fs').readFileSync(file, 'utf8'))"
      - name: Run tests
        run: npm test
      - name: Run deterministic benchmark
        run: npm run benchmark
